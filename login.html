<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Go Ghee - Admin Login</title>
<style>
  body{font-family:Inter,Arial;background:#fff8f0;padding:20px}
  .card{background:#fff;padding:16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,0.06);max-width:420px;margin:30px auto}
  input{width:100%;padding:10px;margin-top:8px;border-radius:8px;border:1px solid #ddd}
  .btn{background:#f5c23b;border:none;padding:10px;border-radius:8px;font-weight:700;cursor:pointer;width:100%}
</style>
</head>
<body>
<div class="card">
  <h2>Admin Login</h2>
  <input id="email" placeholder="Email" value="kytthe744@gmail.com">
  <input id="pass" placeholder="Password" type="password" value="">
  <div style="margin-top:10px">
    <button class="btn" id="login">Login</button>
  </div>
  <div style="margin-top:8px;color:#666;font-size:13px">Admin email: kytthe744@gmail.com</div>
</div>

<script>
const ADMIN_EMAIL = "kytthe744@gmail.com";
const ADMIN_PASS = "769082"; // user-provided for login.html

document.getElementById('login').addEventListener('click', function(){
  const e = document.getElementById('email').value.trim();
  const p = document.getElementById('pass').value.trim();
  if(e === ADMIN_EMAIL && p === ADMIN_PASS){
    // set a short-lived token in sessionStorage and redirect to admin panel
    sessionStorage.setItem('goghee_admin_logged', '1');
    window.location.href = 'admin.html';
  } else {
    alert('Incorrect credentials');
  }
});
</script>
</body>
</html>
