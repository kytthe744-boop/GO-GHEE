<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Go Ghee — Admin Login</title>

<style>
  body{
    font-family: Arial, sans-serif;
    background:#fff8f0;
    margin:0;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
  }
  .box{
    background:#fff;
    width:92%;
    max-width:420px;
    padding:18px;
    border-radius:12px;
    box-shadow:0 8px 30px rgba(0,0,0,0.08);
  }
  input{
    width:100%;
    padding:10px;
    margin-top:10px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:15px;
  }
  button{
    width:100%;
    padding:12px;
    margin-top:12px;
    border-radius:8px;
    background:#f5c23b;
    border:none;
    font-weight:700;
    cursor:pointer;
  }
  #msg{color:red;margin-top:8px;display:none}
</style>
</head>

<body>
<div class="box">
  <h2>Admin Login</h2>

  <input id="email" placeholder="Email">
  <input id="pass" type="password" placeholder="Password">

  <button onclick="login()">Login</button>

  <div id="msg"></div>
</div>

<script>
const ADMIN_EMAIL = "kytthe744@gmail.com";
const ADMIN_PASS  = "769082";

function login(){
  let e = document.getElementById("email").value.trim();
  let p = document.getElementById("pass").value.trim();

  if(e === ADMIN_EMAIL && p === ADMIN_PASS){
      sessionStorage.setItem("goghee_admin","1");
      window.location.href = "admin.html";
  } 
  else {
      let m = document.getElementById("msg");
      m.style.display="block";
      m.innerText="Incorrect email or password!";
  }
}
</script>

</body>
</html>
