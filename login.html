<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Go Ghee — Admin Login</title>
<style>
  body{
    font-family: Arial, sans-serif;
    background:#fff8f0;
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .box{
    background:#fff;
    width:92%;
    max-width:400px;
    padding:18px;
    border-radius:12px;
    box-shadow:0 8px 28px rgba(0,0,0,0.15);
  }
  h2{margin:0 0 8px 0;}
  input{
    width:100%;
    padding:10px;
    margin-top:10px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:15px;
  }
  button{
    width:100%;
    padding:12px;
    margin-top:12px;
    border-radius:8px;
    background:#f5c23b;
    border:none;
    font-weight:700;
    cursor:pointer;
  }
  #msg{color:red;margin-top:8px;display:none;font-size:14px;}
  .wa-support{
    position:fixed;right:14px;bottom:14px;
    background:#25D366;color:#fff;border-radius:999px;
    padding:10px 14px;font-weight:700;
    box-shadow:0 8px 30px rgba(37,211,102,0.3);
    text-decoration:none;font-size:14px;
  }
</style>
</head>
<body>
<div class="box">
  <h2>Admin Login</h2>
  <input id="email" placeholder="Email" autocomplete="off" />
  <input id="pass" type="password" placeholder="Password" />
  <button onclick="login()">Login</button>
  <div id="msg"></div>
</div>

<a class="wa-support" href="https://wa.me/message/YGVHACAEVCTAN1" target="_blank" rel="noopener">
  WhatsApp Support
</a>

<script>
  const ADMIN_EMAIL = "kytthe744@gmail.com";
  const ADMIN_PASS  = "769082";

  function login(){
    const email = (document.getElementById("email").value || "").trim();
    const pass  = (document.getElementById("pass").value || "").trim();
    const msgEl = document.getElementById("msg");

    if(email === ADMIN_EMAIL && pass === ADMIN_PASS){
      // mark admin logged in
      sessionStorage.setItem("goghee_admin_logged", "1");
      window.location.href = "admin.html";
    } else {
      msgEl.style.display = "block";
      msgEl.innerText = "Galat email ya password hai.";
    }
  }
</script>
</body>
</html>
