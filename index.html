<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Ghee - Pure Desi Ghee</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #fff7e6;
}

header {
  background: #ffcc33;
  padding: 15px;
  text-align: center;
  font-size: 24px;
  font-weight: bold;
}

.container {
  padding: 15px;
}

.product-box {
  background: white;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 10px;
  box-shadow: 0 0 5px rgba(0,0,0,0.1);
}

button {
  background: #ff9900;
  color: white;
  padding: 10px 15px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
}

button:hover {
  opacity: 0.8;
}

#cart {
  background: white;
  padding: 15px;
  margin-top: 20px;
  border-radius: 10px;
  box-shadow: 0 0 5px rgba(0,0,0,0.1);
}

input, textarea {
  width: 100%;
  padding: 10px;
  border-radius: 6px;
  border: 1px solid gray;
  margin-bottom: 10px;
}

</style>

<script>
let cart = [];

function addToCart(name, price) {
  cart.push({name, price});
  alert(name + " added to cart!");
  updateCart();
}

function updateCart() {
  let c = document.getElementById("cart-items");
  let total = 0;
  c.innerHTML = "";
  cart.forEach((item) => {
    c.innerHTML += "<p>" + item.name + " - ₹" + item.price + "</p>";
    total += item.price;
  });
  document.getElementById("total").innerText = total;
}

function placeOrder() {
  let name = document.getElementById("name").value;
  let phone = document.getElementById("phone").value;
  let address = document.getElementById("address").value;

  if (!name || !phone || !address) {
    alert("Please fill all details!");
    return;
  }

  alert("Order placed successfully!\nWe will contact you soon.");
}
</script>

</head>
<body>

<header>
  Go Ghee – Pure Desi Ghee
</header>

<div class="container">

  <h2>Products</h2>

  <div class="product-box">
    <h3>250g Go Ghee</h3>
    <p>Price: ₹160</p>
    <button onclick="addToCart('250g Go Ghee', 160)">Add to Cart</button>
  </div>

  <div class="product-box">
    <h3>500g Go Ghee</h3>
    <p>Price: ₹300</p>
    <button onclick="addToCart('500g Go Ghee', 300)">Add to Cart</button>
  </div>

  <div class="product-box">
    <h3>1kg Go Ghee</h3>
    <p>Price: ₹560</p>
    <button onclick="addToCart('1kg Go Ghee', 560)">Add to Cart</button>
  </div>

  <div id="cart">
    <h2>Your Cart</h2>
    <div id="cart-items"></div>
    <h3>Total: ₹<span id="total">0</span></h3>
  </div>

  <h2>Checkout</h2>

  <input id="name" type="text" placeholder="Full Name">
  <input id="phone" type="text" placeholder="Phone Number">
  <textarea id="address" placeholder="Delivery Address"></textarea>

  <button onclick="placeOrder()">Confirm Order</button>

</div>

</body>
</html>
