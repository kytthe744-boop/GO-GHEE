<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Go Ghee - Home</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  body{font-family:Inter,Arial;margin:0;background:#fff8f0;color:#222}
  header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff}
  .brand{display:flex;gap:10px;align-items:center}
  .logo{width:52px;height:52px;border-radius:10px;overflow:hidden}
  main{padding:14px}
  .products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  .card{background:#fff;padding:12px;border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,0.05)}
  .btn{background:#f5c23b;border:none;padding:8px 12px;border-radius:8px;color:#111;font-weight:700;cursor:pointer}
  nav{display:flex;gap:10px}
  a{color:inherit;text-decoration:none}
  footer{padding:14px;text-align:center;color:#666;font-size:13px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo"><img src="logo.jpg" alt="logo" style="width:100%;height:100%;object-fit:cover"></div>
    <div>
      <div style="font-weight:700">Go Ghee</div>
      <div style="font-size:12px;color:#666">Pure • Fresh • Desi Ghee</div>
    </div>
  </div>
  <nav>
    <a href="cart.html" class="btn">Cart (<span id="count">0</span>)</a>
    <a href="login.html" class="btn" style="background:#ddd;color:#000">Admin</a>
  </nav>
</header>

<main>
  <h2>Products</h2>
  <div class="products" id="products"></div>
</main>

<footer>© <span id="yr"></span> Go Ghee</footer>

<script>
const PRODUCTS = [
  {id:'ghee-250', title:'Go Ghee - 250g', price:160},
  {id:'ghee-500', title:'Go Ghee - 500g', price:300},
  {id:'ghee-1kg', title:'Go Ghee - 1kg', price:560},
];

function getCart(){ return JSON.parse(localStorage.getItem('goGheeCart')||'[]'); }
function saveCart(c){ localStorage.setItem('goGheeCart', JSON.stringify(c)); updateCount(); }
function addToCart(id){
  const p = PRODUCTS.find(x=>x.id===id);
  let cart = getCart();
  const ex = cart.find(i=>i.id===id);
  if(ex) ex.qty++;
  else cart.push({id:p.id,title:p.title,price:p.price,qty:1});
  saveCart(cart);
  alert(p.title + ' added to cart');
}

function updateCount(){ const c = getCart().reduce((s,i)=>s+i.qty,0); document.getElementById('count').innerText = c; }

const productsEl = document.getElementById('products');
PRODUCTS.forEach(p=>{
  const d = document.createElement('div'); d.className='card';
  d.innerHTML = `<div style="font-weight:700">${p.title}</div>
    <div style="margin:6px 0;color:#666">Price: ₹${p.price}</div>
    <div><button class="btn" onclick="addToCart('${p.id}')">Add to Cart</button></div>`;
  productsEl.appendChild(d);
});

document.getElementById('yr').innerText = new Date().getFullYear();
updateCount();
</script>
</body>
</html>
