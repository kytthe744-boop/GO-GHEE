<!doctype html>
<html lang="en">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Go Ghee - Admin</title>
<style>
  body{font-family:Inter,Arial;background:#f7f7f9;padding:12px}
  .card{background:#fff;padding:12px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,0.06);margin-bottom:12px}
  table{width:100%;border-collapse:collapse}
  th,td{padding:8px;border-bottom:1px solid #eee;text-align:left;font-size:13px}
  button{padding:8px 10px;border-radius:8px;border:none;background:#f5c23b;cursor:pointer}
  .danger{background:#ffd6d6}
  @media(max-width:600px){ th,td{font-size:12px} }
</style>
</head>
<body>
<div class="card">
  <h2>Admin Orders</h2>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <input id="q" placeholder="Search name/phone/order id" style="flex:1;padding:8px;border-radius:8px;border:1px solid #ddd">
    <button id="searchBtn">Search</button>
    <button id="refreshBtn">Refresh</button>
    <button id="downloadBtn">Download CSV</button>
    <button id="logoutBtn" style="background:#ddd;color:#000">Logout</button>
  </div>
  <div id="list" style="margin-top:12px;overflow:auto"></div>
</div>

<script>
function requireLogin(){
  const ok = sessionStorage.getItem('goghee_admin_logged')==='1';
  if(!ok){ alert('Please login first'); window.location.href='login.html'; }
}
requireLogin();

const LS = 'goGheeOrders';

function loadOrders(){ return JSON.parse(localStorage.getItem(LS)||'[]'); }
function saveOrders(o){ localStorage.setItem(LS, JSON.stringify(o)); }

function render(orders){
  const el = document.getElementById('list');
  if(!orders.length){ el.innerHTML = '<div style="color:#666">No orders</div>'; return; }
  let html = '<table><thead><tr><th>Order</th><th>Customer</th><th>Phone</th><th>Items</th><th>Total</th><th>Time</th><th>Actions</th></tr></thead><tbody>';
  orders.slice().reverse().forEach(o=>{
    const items = (o.items||[]).map(i=>`${i.title} x${i.qty}`).join('<br>');
    html += `<tr data-id="${o.orderId}">
      <td><strong>${o.orderId}</strong></td>
      <td>${o.name}<br><small>${o.village}, ${o.post}, ${o.district}, ${o.state} - ${o.pincode}</small></td>
      <td>${o.phone}</td>
      <td>${items}</td>
      <td>₹${o.total}</td>
      <td>${new Date(o.date).toLocaleString()}</td>
      <td>
        <button onclick="mark('${o.orderId}')">Mark</button>
        <button onclick="view('${o.orderId}')">View</button>
        <button class="danger" onclick="del('${o.orderId}')">Delete</button>
      </td>
    </tr>`;
  });
  html += '</tbody></table>';
  el.innerHTML = html;
}

function mark(id){
  const orders = loadOrders();
  const idx = orders.findIndex(x=>x.orderId===id);
  if(idx===-1) return alert('Not found');
  orders[idx].processed = !orders[idx].processed;
  saveOrders(orders); render(loadOrders());
}
function view(id){
  const orders = loadOrders();
  const o = orders.find(x=>x.orderId===id);
  if(!o) return alert('Not found');
  alert(`Order ${o.orderId}\\nName: ${o.name}\\nPhone: ${o.phone}\\nAddress: ${o.village}, ${o.post}, ${o.district}, ${o.state} - ${o.pincode}\\nItems:\\n${(o.items||[]).map(i=>i.title+' x'+i.qty).join('\\n')}\\nTotal: ₹${o.total}`);
}
function del(id){
  if(!confirm('Delete?')) return;
  const orders = loadOrders().filter(x=>x.orderId!==id);
  saveOrders(orders); render(loadOrders());
}
function downloadCSV(){
  const orders = loadOrders();
  if(!orders.length) return alert('No orders');
  const rows = ['orderId,date,name,phone,email,village,post,district,state,pincode,address,items,total,processed'];
  orders.forEach(o=>{
    const items = (o.items||[]).map(i=>`${i.title} x${i.qty}`).join(' | ');
    const clean = v => '"'+String(v||'').replace(/"/g,'""')+'"';
    rows.push([clean(o.orderId), clean(o.date), clean(o.name), clean(o.phone), clean(o.email), clean(o.village), clean(o.post), clean(o.district), clean(o.state), clean(o.pincode), clean(o.address), clean(items), clean(o.total), clean(o.processed?'yes':'no')].join(','));
  });
  const blob = new Blob([rows.join('\\n')], {type:'text/csv'}); const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='orders.csv'; a.click(); URL.revokeObjectURL(url);
}

document.getElementById('searchBtn').addEventListener('click', function(){
  const q = (document.getElementById('q').value||'').toLowerCase().trim();
  const res = loadOrders().filter(o => (o.name||'').toLowerCase().includes(q) || (o.phone||'').includes(q) || (o.orderId||'').toLowerCase().includes(q));
  render(res);
});
document.getElementById('refreshBtn').addEventListener('click', ()=>render(loadOrders()));
document.getElementById('downloadBtn').addEventListener('click', downloadCSV);
document.getElementById('logoutBtn').addEventListener('click', function(){ sessionStorage.removeItem('goghee_admin_logged'); window.location.href='login.html'; });

render(loadOrders());
</script>
</body>
</html>
